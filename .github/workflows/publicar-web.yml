# Compila la app de Flutter para web y la publica en GitHub Pages.
# Se ejecuta al hacer push a main o manualmente desde la pestaña "Actions".
# Requisito (una sola vez): Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# La página queda en https://<usuario>.github.io/<repositorio>/
name: Publicar versión web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Completa la carpeta web/ con los archivos que falten (no reemplaza los que ya existen)
      - run: flutter create --org co.edu.umb --project-name parqueadero_app --platforms=web .
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages no tiene rutas propias: 404.html devuelve la app en cualquier dirección
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
